<!DOCTYPE html>
<html lang="en">
<head>

    <title>Semantic Conversion</title>
</head>

<body>

    <header>
        <h1>My Site</h1>

        <nav>
            <a href="#">Home</a>
            <a href="#">About</a>

    </header>

    <main>
        <article>
            <h2>Welcome to My Site</h2>

        </article>

        <aside>

        </aside>
    </main>

    <footer>
        <p>&copy; 2026 My Site</p>
    </footer>

</body>
</html>
